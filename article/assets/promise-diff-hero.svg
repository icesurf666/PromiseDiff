  <text x="70" y="180" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-3">Do your files keep</text><text x="70" y="252" fill="#c9a8ff" font-family="Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-3">the promises you sell?</text>
  <text x="70" y="302" fill="#89899a" font-family="Arial,sans-serif" font-size="24">PDF facts + local Gemma + evidence that is checked before it is shown.</text>
  <g transform="translate(70 380)"><rect width="255" height="132" rx="14" fill="#13131b" stroke="#292936"/><text x="22" y="34" fill="#89899a" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">LISTING</text><text x="22" y="73" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="25" font-weight="700">“48 pages · A4 +</text><text x="22" y="104" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="25" font-weight="700">US Letter”</text></g>
  <path d="M350 446h94" stroke="#a970ff" stroke-width="4"/><path d="M430 434l18 12-18 12" fill="#a970ff"/>
  <g transform="translate(470 380)"><rect width="255" height="132" rx="14" fill="#13131b" stroke="#a970ff"/><text x="22" y="34" fill="#c9a8ff" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">EVIDENCE GATE</text><text x="22" y="80" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="29" font-weight="700">verify</text><text x="22" y="109" fill="#89899a" font-family="Arial,sans-serif" font-size="18">quote · page · file</text></g>
