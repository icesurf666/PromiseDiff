<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PromiseDiff checks whether a product listing matches its PDF delivery</title>
  <desc id="desc">A product listing and a PDF download flow into an evidence-checked report with supported, contradicted and unverified findings.</desc>
  <rect width="1200" height="630" fill="#09090d"/><circle cx="1080" cy="-40" r="370" fill="#a970ff" opacity=".16"/><circle cx="80" cy="650" r="300" fill="#c7ff39" opacity=".06"/>
