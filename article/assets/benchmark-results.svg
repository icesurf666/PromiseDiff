<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">PromiseDiff synthetic benchmark results</title><desc id="desc">Nine of ten synthetic benchmark cases received the expected verdict. The one semantic paraphrase was conservatively unverified.</desc>
  <rect width="1200" height="620" fill="#0b0b10"/><text x="60" y="68" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="41" font-weight="800">Nine right. One honest miss.</text><text x="60" y="106" fill="#89899a" font-family="Arial,sans-serif" font-size="21">A tiny synthetic benchmark, reported with the failure instead of smoothing it away.</text>
  <g transform="translate(60 155)"><rect width="285" height="320" rx="14" fill="#15111d" stroke="#a970ff"/><text x="26" y="44" fill="#c9a8ff" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">EXACT-LABEL ACCURACY</text><text x="26" y="152" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="100" font-weight="800">9/10</text><text x="26" y="192" fill="#89899a" font-family="Arial,sans-serif" font-size="22">90% on synthetic cases</text><path d="M26 232h232" stroke="#292936"/><text x="26" y="270" fill="#c7ff39" font-family="ui-monospace,monospace" font-size="17">median 2.11 s</text><text x="26" y="298" fill="#89899a" font-family="ui-monospace,monospace" font-size="15">local Gemma on this machine</text></g>
  <g transform="translate(410 155)"><text x="0" y="0" fill="#89899a" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">EXPECTED VERDICTS / CORRECT CASES</text><line x1="0" y1="245" x2="690" y2="245" stroke="#51515d"/><g font-family="Arial,sans-serif" font-size="17" fill="#b6b6c2"><text x="0" y="280">SUPPORTED</text><text x="0" y="330">CONTRADICTED</text><text x="0" y="380">UNVERIFIED</text><text x="0" y="430">OUT OF SCOPE</text></g><g fill="#c7ff39"><rect x="170" y="261" width="390" height="22" rx="5"/><rect x="170" y="311" width="260" height="22" rx="5"/><rect x="170" y="361" width="390" height="22" rx="5"/><rect x="170" y="411" width="130" height="22" rx="5"/></g><g font-family="ui-monospace,monospace" font-size="16" fill="#f0f0f5"><text x="580" y="279">3 / 4</text><text x="450" y="329">2 / 2</text><text x="580" y="379">3 / 3</text><text x="320" y="429">1 / 1</text></g><rect x="560" y="261" width="130" height="22" rx="5" fill="#ff5268" opacity=".9"/><text x="560" y="235" fill="#ff7183" font-family="ui-monospace,monospace" font-size="13">one paraphrase → UNVERIFIED</text></g>
</svg>
