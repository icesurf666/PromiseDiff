<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">PromiseDiff verdict matrix</title><desc id="desc">Four outcomes distinguish supported, contradicted, unverified and out of scope claims.</desc>
  <rect width="1200" height="560" fill="#0b0b10"/><text x="60" y="68" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="41" font-weight="800">The point is to be precise, not dramatic.</text><text x="60" y="106" fill="#89899a" font-family="Arial,sans-serif" font-size="21">A missing citation should not become a false accusation.</text>
  <g transform="translate(60 160)"><rect width="250" height="280" rx="14" fill="#131a12" stroke="#c7ff39"/><circle cx="32" cy="38" r="9" fill="#c7ff39"/><text x="54" y="44" fill="#c7ff39" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">SUPPORTED</text><text x="22" y="104" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="25" font-weight="700">The file backs it up.</text><text x="22" y="148" fill="#b6b6c2" font-family="Arial,sans-serif" font-size="18">A measured fact matches, or</text><text x="22" y="174" fill="#b6b6c2" font-family="Arial,sans-serif" font-size="18">a checked quote supports it.</text><text x="22" y="240" fill="#89899a" font-family="ui-monospace,monospace" font-size="14">48 pages found / 48 promised</text></g>
  <g transform="translate(335 160)"><rect width="250" height="280" rx="14" fill="#201116" stroke="#ff5268"/><circle cx="32" cy="38" r="9" fill="#ff5268"/><text x="54" y="44" fill="#ff7183" font-family="ui-monospace,monospace" font-size="13" letter-spacing="1">CONTRADICTED</text><text x="22" y="104" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="25" font-weight="700">A fact conflicts.</text><text x="22" y="148" fill="#b6b6c2" font-family="Arial,sans-serif" font-size="18">The claim can be measured and</text><text x="22" y="174" fill="#b6b6c2" font-family="Arial,sans-serif" font-size="18">the measurement disagrees.</text><text x="22" y="240" fill="#89899a" font-family="ui-monospace,monospace" font-size="14">A4 found / US Letter missing</text></g>
  <g transform="translate(610 160)"><rect width="250" height="280" rx="14" fill="#181424" stroke="#a970ff"/><circle cx="32" cy="38" r="9" fill="#a970ff"/><text x="54" y="44" fill="#c9a8ff" font-family="ui-monospace,monospace" font-size="13" letter-spacing="1">UNVERIFIED</text><text x="22" y="104" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="25" font-weight="700">Not enough proof.</text><text x="22" y="148" fill="#b6b6c2" font-family="Arial,sans-serif" font-size="18">The files do not establish</text><text x="22" y="174" fill="#b6b6c2" font-family="Arial,sans-serif" font-size="18">the claim either way.</text><text x="22" y="240" fill="#89899a" font-family="ui-monospace,monospace" font-size="14">No checked semantic citation</text></g>
  <g transform="translate(885 160)"><rect width="255" height="280" rx="14" fill="#13131b" stroke="#51515d"/><circle cx="32" cy="38" r="9" fill="#89899a"/><text x="54" y="44" fill="#c4c4cf" font-family="ui-monospace,monospace" font-size="13" letter-spacing="1">OUT OF SCOPE</text><text x="22" y="104" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="25" font-weight="700">Wrong tool for it.</text><text x="22" y="148" fill="#b6b6c2" font-family="Arial,sans-serif" font-size="18">The claim needs a capability</text><text x="22" y="174" fill="#b6b6c2" font-family="Arial,sans-serif" font-size="18">this MVP does not have.</text><text x="22" y="240" fill="#89899a" font-family="ui-monospace,monospace" font-size="14">Canva compatibility</text></g>
  <text x="60" y="510" fill="#51515d" font-family="ui-monospace,monospace" font-size="14">MISSING EVIDENCE ≠ CONTRADICTION</text>
</svg>
