<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">PromiseDiff verification flow</title><desc id="desc">Listing claims and PDF files move through deterministic checks and local semantic retrieval before evidence validation.</desc>
  <rect width="1200" height="620" fill="#0b0b10"/><text x="60" y="70" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="42" font-weight="800">One report. Two kinds of evidence.</text><text x="60" y="108" fill="#89899a" font-family="Arial,sans-serif" font-size="21">Measure facts directly. Ask the model only where meaning is involved.</text>
  <path d="M60 154H1140" stroke="#292936"/><g font-family="ui-monospace,monospace" font-size="13" letter-spacing="2"><text x="60" y="185" fill="#c7ff39">INPUTS</text><text x="409" y="185" fill="#c9a8ff">VERIFY</text><text x="836" y="185" fill="#c7ff39">OUTPUT</text></g>
  <g transform="translate(60 225)"><rect width="240" height="118" rx="12" fill="#13131b" stroke="#292936"/><text x="22" y="33" fill="#89899a" font-family="ui-monospace,monospace" font-size="12">PRODUCT LISTING</text><text x="22" y="74" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="25" font-weight="700">claims</text><text x="22" y="100" fill="#89899a" font-family="Arial,sans-serif" font-size="16">pages · editions · content</text></g>
  <g transform="translate(60 385)"><rect width="240" height="118" rx="12" fill="#13131b" stroke="#292936"/><text x="22" y="33" fill="#89899a" font-family="ui-monospace,monospace" font-size="12">DELIVERED FILES</text><text x="22" y="74" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="25" font-weight="700">PDF / ZIP</text><text x="22" y="100" fill="#89899a" font-family="Arial,sans-serif" font-size="16">pages · geometry · text</text></g>
  <path d="M320 284h55M320 444h55" stroke="#a970ff" stroke-width="3"/><path d="M364 276l14 8-14 8M364 436l14 8-14 8" fill="#a970ff"/>
  <g transform="translate(395 225)"><rect width="340" height="118" rx="12" fill="#15111d" stroke="#a970ff"/><text x="22" y="33" fill="#c9a8ff" font-family="ui-monospace,monospace" font-size="12">DETERMINISTIC PATH</text><text x="22" y="75" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="25" font-weight="700">PyMuPDF measurements</text><text x="22" y="101" fill="#89899a" font-family="Arial,sans-serif" font-size="16">count · dimensions · file inventory</text></g>
  <g transform="translate(395 385)"><rect width="340" height="118" rx="12" fill="#15111d" stroke="#a970ff"/><text x="22" y="33" fill="#c9a8ff" font-family="ui-monospace,monospace" font-size="12">SEMANTIC PATH</text><text x="22" y="75" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="25" font-weight="700">Gemma + retrieval</text><text x="22" y="101" fill="#89899a" font-family="Arial,sans-serif" font-size="16">meaning · citations · exact excerpts</text></g>
  <path d="M755 284h55M755 444h55" stroke="#a970ff" stroke-width="3"/><path d="M799 276l14 8-14 8M799 436l14 8-14 8" fill="#a970ff"/>
  <g transform="translate(830 285)"><rect width="310" height="158" rx="12" fill="#13131b" stroke="#c7ff39"/><text x="22" y="33" fill="#c7ff39" font-family="ui-monospace,monospace" font-size="12">EVIDENCE VALIDATION</text><text x="22" y="77" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="26" font-weight="700">Auditable finding</text><text x="22" y="108" fill="#89899a" font-family="Arial,sans-serif" font-size="16">Does the quote occur?</text><text x="22" y="132" fill="#89899a" font-family="Arial,sans-serif" font-size="16">Is the file and page real?</text></g>
  <text x="60" y="575" fill="#51515d" font-family="ui-monospace,monospace" font-size="14">A model response is not evidence until the document checks it.</text>
</svg>
