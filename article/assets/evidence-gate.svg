<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">The evidence gate blocks unsupported model citations</title><desc id="desc">A model suggestion must pass filename, page and exact quotation checks before a semantic claim is supported.</desc>
  <rect width="1200" height="560" fill="#0b0b10"/><text x="60" y="68" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="41" font-weight="800">A useful model answer still has to prove itself.</text><text x="60" y="106" fill="#89899a" font-family="Arial,sans-serif" font-size="21">Semantic support only survives when its citation checks out against the PDF text.</text>
  <g transform="translate(60 182)"><rect width="270" height="190" rx="14" fill="#15111d" stroke="#a970ff"/><text x="24" y="34" fill="#c9a8ff" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">GEMMA SUGGESTION</text><text x="24" y="82" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="23" font-weight="700">“Savings tracker”</text><text x="24" y="117" fill="#89899a" font-family="Arial,sans-serif" font-size="17">planner.pdf · page 12</text><text x="24" y="145" fill="#89899a" font-family="Arial,sans-serif" font-size="17">quoted evidence attached</text></g>
  <path d="M350 277h94" stroke="#a970ff" stroke-width="4"/><path d="M430 265l18 12-18 12" fill="#a970ff"/>
  <g transform="translate(465 150)"><rect width="300" height="254" rx="14" fill="#13131b" stroke="#292936"/><text x="24" y="36" fill="#c7ff39" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">EVIDENCE GATE</text><g font-family="Arial,sans-serif" font-size="20"><circle cx="34" cy="82" r="8" fill="#c7ff39"/><text x="55" y="89" fill="#f0f0f5">Filename exists</text><circle cx="34" cy="130" r="8" fill="#c7ff39"/><text x="55" y="137" fill="#f0f0f5">Page exists</text><circle cx="34" cy="178" r="8" fill="#c7ff39"/><text x="55" y="185" fill="#f0f0f5">Quote occurs verbatim</text></g><path d="M24 212h252" stroke="#292936"/><text x="24" y="240" fill="#89899a" font-family="ui-monospace,monospace" font-size="13">otherwise → UNVERIFIED</text></g>
  <path d="M785 277h94" stroke="#c7ff39" stroke-width="4"/><path d="M865 265l18 12-18 12" fill="#c7ff39"/>
  <g transform="translate(900 182)"><rect width="240" height="190" rx="14" fill="#131a12" stroke="#c7ff39"/><text x="24" y="34" fill="#c7ff39" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">SUPPORTED</text><text x="24" y="86" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="26" font-weight="700">Evidence you can</text><text x="24" y="118" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="26" font-weight="700">open and inspect.</text><text x="24" y="158" fill="#89899a" font-family="Arial,sans-serif" font-size="17">No invisible model leap.</text></g>
  <text x="60" y="495" fill="#51515d" font-family="ui-monospace,monospace" font-size="14">THE MODEL PROPOSES · THE DOCUMENT DECIDES</text>
</svg>
