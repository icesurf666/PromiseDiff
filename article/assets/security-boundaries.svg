<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">PromiseDiff upload security boundaries</title><desc id="desc">Untrusted PDF and ZIP uploads are checked for size, archive paths, compression, encryption, pages and text before analysis.</desc>
  <rect width="1200" height="560" fill="#0b0b10"/><text x="60" y="68" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="41" font-weight="800">The file arrives untrusted.</text><text x="60" y="106" fill="#89899a" font-family="Arial,sans-serif" font-size="21">The upload boundary rejects problems before a PDF reaches the analysis pipeline.</text>
  <g transform="translate(60 178)"><rect width="240" height="225" rx="14" fill="#201116" stroke="#ff5268"/><text x="23" y="38" fill="#ff7183" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">UNTRUSTED INPUT</text><text x="23" y="89" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="31" font-weight="800">PDF or ZIP</text><text x="23" y="127" fill="#b6b6c2" font-family="Arial,sans-serif" font-size="18">may be corrupt, encrypted,</text><text x="23" y="153" fill="#b6b6c2" font-family="Arial,sans-serif" font-size="18">oversized or malicious.</text></g>
  <path d="M320 290h85" stroke="#a970ff" stroke-width="4"/><path d="M391 278l18 12-18 12" fill="#a970ff"/>
  <g transform="translate(425 145)"><rect width="350" height="290" rx="14" fill="#13131b" stroke="#a970ff"/><text x="24" y="38" fill="#c9a8ff" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">BOUNDARY CHECKS</text><g font-family="Arial,sans-serif" font-size="20" fill="#f0f0f5"><text x="24" y="84">12 MB upload cap</text><text x="24" y="122">8 PDFs · 160 total pages</text><text x="24" y="160">60 MB expanded ZIP cap</text><text x="24" y="198">No traversal, duplicates or symlinks</text><text x="24" y="236">No nested ZIPs or encryption</text></g><text x="24" y="270" fill="#89899a" font-family="ui-monospace,monospace" font-size="13">uploads are not persisted</text></g>
  <path d="M795 290h85" stroke="#c7ff39" stroke-width="4"/><path d="M866 278l18 12-18 12" fill="#c7ff39"/>
  <g transform="translate(900 178)"><rect width="240" height="225" rx="14" fill="#131a12" stroke="#c7ff39"/><text x="23" y="38" fill="#c7ff39" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">ANALYSIS</text><text x="23" y="89" fill="#f0f0f5" font-family="Arial,sans-serif" font-size="31" font-weight="800">Inspect safely</text><text x="23" y="127" fill="#b6b6c2" font-family="Arial,sans-serif" font-size="18">only bounded text and</text><text x="23" y="153" fill="#b6b6c2" font-family="Arial,sans-serif" font-size="18">metadata move forward.</text></g>
  <text x="60" y="500" fill="#51515d" font-family="ui-monospace,monospace" font-size="14">PUBLIC DEPLOYMENTS SHOULD STILL ISOLATE PDF PROCESSING IN A RESOURCE-LIMITED WORKER.</text>
</svg>
